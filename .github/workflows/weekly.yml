# ============================================================
#  KOVAS 주간 트렌드 자동 생성 (GitHub Actions) — 데일리와 분리된 독립 워크플로
# ------------------------------------------------------------
#  매주 금요일 저녁, 그 주(토~금)의 데일리 리포트를 묶어 '주간 트렌드'와
#  이메일 초안을 만듭니다. 데일리 수집과 섞이지 않아, 안 돌면 바로 눈에 띕니다.
#
#  놓을 위치: 저장소 안  .github/workflows/weekly.yml
# ============================================================

name: 주간 트렌드 생성

on:
  schedule:
    # 금요일 저녁에 실행. 그날 데일리(아침 7시)가 이미 쌓인 뒤라야 하므로 저녁으로 둡니다.
    # 한국시간(KST) 금요일 20:00 = UTC 금요일 11:00.
    - cron: "0 11 * * 5"
  # GitHub 화면에서 '지금 즉시 실행' 버튼으로도 돌릴 수 있습니다.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # 주간 트렌드 생성 (이번 주 토~금을 묶어 요약 + 이메일 초안)
      - name: 주간 트렌드 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python weekly.py

      # 생성된 data 폴더를 저장소에 자동 커밋
      - name: 결과 저장(커밋)
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "주간 트렌드 자동 생성 ($(date +%F))"
          git push
